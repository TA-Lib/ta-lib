name: VWMA
group: Overlap Studies
hint: Volume Weighted Moving Average
flags: [overlap, stream, nan_inf_output, period1_identity]
inputs:
  - name: inReal
    type: real
  - name: inPriceV
    type: price
    price_components: [volume]
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [1, 100000]
    default: 30
    suggested: [1, 200, 1]
outputs:
  - name: outReal
    type: real
    flags: [line]
