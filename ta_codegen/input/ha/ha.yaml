name: HA
group: Price Transform
hint: Heikin-Ashi Candles
flags: [overlap, unstable_period, stream]
inputs:
  - name: inPriceOHLC
    type: price
    price_components: [open, high, low, close]
outputs:
  - name: outHAOpen
    type: real
    flags: [line]
  - name: outHAHigh
    type: real
    flags: [line, upper_limit]
  - name: outHALow
    type: real
    flags: [line, lower_limit]
  - name: outHAClose
    type: real
    flags: [line]
