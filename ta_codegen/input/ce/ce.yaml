name: CE
group: Overlap Studies
hint: Chandelier Exit
flags: [overlap, stream]
inputs:
  - name: inPriceHLC
    type: price
    price_components: [high, low, close]
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: ATR and extreme window
    range: [2, 100000]
    default: 22
    suggested: [4, 200, 1]
  - name: optInMultiplier
    type: real
    display_name: Multiplier
    hint: ATR multiplier
    range: [0, TA_REAL_MAX]
    default: 3.0
    precision: 2
    suggested: [1, 5, 0.5]
outputs:
  - name: outRealLong
    type: real
    flags: [lower_limit]
  - name: outRealShort
    type: real
    flags: [upper_limit]
