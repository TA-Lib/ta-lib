name: SORTINO
group: Statistic Functions
hint: Rolling Sortino Ratio
flags: [stream, nan_inf_output]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Number of returns in the window
    range: [2, 100000]
    default: 20
    suggested: [4, 200, 1]
  - name: optInMAR
    type: real
    display_name: Minimum Acceptable Return per Bar
    hint: Minimum acceptable return per bar
    range: [TA_REAL_MIN, TA_REAL_MAX]
    default: 0
    precision: 8
    suggested: [0, 0.001, 0.0001]
  - name: optInAnnualization
    type: real
    display_name: Annualization
    hint: Bars per year
    range: [0, TA_REAL_MAX]
    default: 252
    precision: 2
    suggested: [1, 365, 1]
outputs:
  - name: outReal
    type: real
    flags: [line, zero, positive, negative]
