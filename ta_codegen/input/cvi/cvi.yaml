name: CVI
group: Volatility Indicators
hint: Chaikin's Volatility
flags: [stream]
inputs:
  - name: inPriceHL
    type: price
    price_components: [high, low]
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Period of the EMA smoothing the high-low spread
    range: [2, 100000]
    default: 10
    suggested: [4, 200, 1]
  - name: optInROCPeriod
    type: integer
    display_name: ROC Period
    hint: Number of bars the rate of change reaches back
    range: [1, 100000]
    default: 10
    suggested: [4, 200, 1]
outputs:
  - name: outReal
    type: real
    flags: [line]
