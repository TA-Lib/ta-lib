# Per function, the bar counts at which the npm package's default entry sends
# the batch call to the WASM engine; a function not listed never goes. `F: N`
# means from N bars on; `F: [LO, HI]` means from LO through HI bars, inclusive.
# Entries come from scripts/wasm_routing_table.py over timings of the public
# call on every timing host; an entry may cover sizes where no host loses by
# more than the script's tolerance.
