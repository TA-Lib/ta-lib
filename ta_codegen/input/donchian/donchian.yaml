name: DONCHIAN
group: Overlap Studies
hint: Donchian Channels
flags: [overlap]
inputs:
  - name: inPriceHL
    type: price
    price_components: [high, low]
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 20
    suggested: [4, 200, 1]
  - name: optInLag
    type: integer
    display_name: Lag
    hint: Bars the window is held back from the current bar (0 includes the current bar)
    range: [0, 100000]
    default: 1
    suggested: [0, 1, 1]
outputs:
  - name: outRealUpperBand
    type: real
    flags: [upper_limit]
  - name: outRealMiddleBand
    type: real
    flags: [line]
  - name: outRealLowerBand
    type: real
    flags: [lower_limit]
