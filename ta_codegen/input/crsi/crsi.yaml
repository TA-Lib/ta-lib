name: CRSI
group: Momentum Indicators
hint: Connors Relative Strength Index
flags: [stream]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 3
    suggested: [2, 20, 1]
  - name: optInStreakPeriod
    type: integer
    display_name: Streak Period
    hint: Time period of the RSI of the up/down streak
    range: [2, 100000]
    default: 2
    suggested: [2, 20, 1]
  - name: optInRankPeriod
    type: integer
    display_name: Rank Period
    hint: Number of previous one-bar returns the current one is ranked against
    range: [2, 10000]
    default: 100
    suggested: [20, 200, 20]
outputs:
  - name: outReal
    type: real
    flags: [line]
