name: RVIR
group: Volatility Indicators
hint: Relative Volatility Index, refined high/low form
flags: [stream]
inputs:
  - name: inPriceHL
    type: price
    price_components: [high, low]
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period of the Wilder smoothing applied to both legs
    range: [1, 100000]
    default: 14
    suggested: [4, 200, 1]
  - name: optInStdDevPeriod
    type: integer
    display_name: StdDev Period
    hint: Time period of the standard deviation
    range: [2, 100000]
    default: 10
    suggested: [4, 200, 1]
outputs:
  - name: outReal
    type: real
    flags: [line]
