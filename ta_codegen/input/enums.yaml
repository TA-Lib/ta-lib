# Enum type definitions for ta_codegen.
#
# ONE NAME PER VARIANT, spelled verbatim in every backend. C alone prepends the
# enum's `c_prefix` — the same rule the indicator names follow (`SMA` in Rust,
# Java and C#; `TA_SMA` in C). One spelling means nothing to keep in sync and no
# way for a backend's constant to disagree with the name it is declared under.
#
#   c_prefix: the C constant prefix for this enum
#   name:     the variant identity. Used verbatim by Rust, Java and C#, as the
#             source case label (`MAType_SMA`), and by C after `c_prefix`.
#   value:    the pinned integer. Part of the ABI: identical in every backend,
#             append-only. Retire a variant by reserving its slot (see UNUSED_*
#             below), never by deleting or renumbering it.

MAType:
  c_prefix: TA_MAType_
  variants:
    - { name: SMA,   value: 0 }
    - { name: EMA,   value: 1 }
    - { name: WMA,   value: 2 }
    - { name: DEMA,  value: 3 }
    - { name: TEMA,  value: 4 }
    - { name: TRIMA, value: 5 }
    - { name: KAMA,  value: 6 }
    - { name: MAMA,  value: 7 }
    - { name: T3,    value: 8 }
    - { name: HMA,   value: 9 }
    # DISABLED and DEFAULT name no average; each selects a behaviour, and their
    # prose lives with the emitters (backends::common::ma_pseudo_member_doc).
    # DISABLED (#93): dispatch is the pre-switch identity guard in ma/ma.c
    # (batch + stream), not a switch arm.
    - { name: DISABLED, value: 10 }
    # DEFAULT (#182): the validation prologue substitutes it before the body
    # runs, so it never reaches a switch arm either.
    - { name: DEFAULT,  value: 11 }
    # A real average sitting after the two pseudo-members, because 10 and 11 are
    # shipped ABI. Cosmetic, and not to be "fixed" by renumbering.
    - { name: ZLEMA,    value: 12 }
    - { name: RMA,      value: 13 }

# FuncUnstId — the unstable-period function IDs. This list IS the source of truth
# for the FuncUnstId enum generated into the GENCODE section of include/ta_defs.h
# (ta_codegen takes over gen_code's last role there). Order = ascending `value`,
# which is the enum ordinal (the C/Java backends index unstablePeriod[] by it).
# The TA_FUNC_UNST_ALL / _NONE sentinels are appended by the generator, not listed
# here. Add a row when a new indicator gains an unstable period — APPEND it, never
# insert: a mid-list insertion renumbers every later id and the contiguity check
# cannot see it (all it requires is position == value, which a lockstep renumber
# satisfies).
FuncUnstId:
  c_prefix: TA_FUNC_UNST_
  variants:
    - { name: ADX,          value: 0 }
    - { name: UNUSED_1,     value: 1 }   # reserved: was ADXR, knob was inert (#129); kept for ABI, reusable
    - { name: ATR,          value: 2 }
    - { name: CMO,          value: 3 }
    - { name: DX,           value: 4 }
    - { name: EMA,          value: 5 }
    - { name: HT_DCPERIOD,  value: 6 }
    - { name: HT_DCPHASE,   value: 7 }
    - { name: HT_PHASOR,    value: 8 }
    - { name: HT_SINE,      value: 9 }
    - { name: HT_TRENDLINE, value: 10 }
    - { name: HT_TRENDMODE, value: 11 }
    - { name: UNUSED_12,    value: 12 }  # reserved: was IMI, reclassified stable (#14); kept for ABI, reusable
    - { name: KAMA,         value: 13 }
    - { name: MAMA,         value: 14 }
    - { name: UNUSED_15,    value: 15 }  # reserved: was MFI, reclassified stable (#4); kept for ABI, reusable
    - { name: MINUS_DI,     value: 16 }
    - { name: MINUS_DM,     value: 17 }
    - { name: NATR,         value: 18 }
    - { name: PLUS_DI,      value: 19 }
    - { name: PLUS_DM,      value: 20 }
    - { name: RSI,          value: 21 }
    - { name: UNUSED_22,    value: 22 }  # reserved: was STOCHRSI, knob was inert (#129); kept for ABI, reusable
    - { name: T3,           value: 23 }
    - { name: RMA,          value: 24 }
    - { name: HA,           value: 25 }
    - { name: RVI,          value: 26 }
