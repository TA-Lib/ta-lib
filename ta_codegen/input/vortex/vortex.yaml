name: VORTEX
group: Momentum Indicators
hint: Vortex Indicator
flags: [stream]
inputs:
  - name: inPriceHLC
    type: price
    price_components: [high, low, close]
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Number of bars in the rolling sums
    range: [1, 100000]
    default: 14
    suggested: [1, 200, 1]
outputs:
  - name: outPlusVI
    type: real
    flags: [line]
  - name: outMinusVI
    type: real
    flags: [line]
