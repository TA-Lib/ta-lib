name: SYNTH28
group: Math Operators
hint: Synthetic gate function 28 - copied and partially rewritten intermediates read at a lag (never shipped)
flags: [stream]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 4
    suggested: [4, 200, 1]
  - name: optInLag
    type: integer
    display_name: Lag
    hint: Bars the lagged copy is read back
    range: [1, 100000]
    default: 2
    suggested: [1, 30, 1]
outputs:
  - name: outMaxNow
    type: real
    flags: [line]
  - name: outMaxLag
    type: real
    flags: [line]
  - name: outSide
    type: integer
    flags: [line]
