name: SYNTH27
group: Math Operators
hint: Synthetic gate function 27 - one series read at a lag in both arms of a mode switch (never shipped)
flags: [stream]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 4
    suggested: [4, 200, 1]
  - name: optInLag
    type: integer
    display_name: Lag
    hint: Bars the lagged leg is read back
    range: [0, 100000]
    default: 2
    suggested: [0, 30, 1]
  - name: optInMode
    type: integer
    display_name: Mode
    hint: Which comparison the output takes
    range: [0, 1]
    default: 1
    suggested: [0, 1, 1]
outputs:
  - name: outUp
    type: integer
    flags: [line]
