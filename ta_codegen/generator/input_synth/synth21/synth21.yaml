name: SYNTH21
group: Math Operators
hint: Synthetic gate function 21 - a conditional warm-up read whose index divides by a zeroable parameter (never shipped)
# `path_dependent`: the seed sums the warm-up window before the first requested
# bar, so a sub-range call answers differently.
flags: [stream, path_dependent]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 30
    suggested: [4, 200, 1]
outputs:
  - name: outReal
    type: real
    flags: [line]
