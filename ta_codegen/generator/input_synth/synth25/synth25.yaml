name: SYNTH25
group: Math Operators
hint: Synthetic gate function 25 - an intermediate read across series at three shifts (never shipped)
flags: [stream]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 4
    suggested: [4, 200, 1]
  - name: optInShiftA
    type: integer
    display_name: Shift A
    hint: Bars the first leg is read back
    range: [0, 100000]
    default: 2
    suggested: [0, 30, 1]
  - name: optInShiftB
    type: integer
    display_name: Shift B
    hint: Bars the second leg is read back
    range: [0, 100000]
    default: 1
    suggested: [0, 30, 1]
  - name: optInShiftC
    type: integer
    display_name: Shift C
    hint: Bars the third leg is read back
    range: [0, 100000]
    default: 3
    suggested: [0, 30, 1]
outputs:
  - name: outAB
    type: integer
    flags: [line]
  - name: outAC
    type: integer
    flags: [line]
