name: SYNTH14
group: Math Operators
hint: Synthetic gate function 14 - a cross-indicator call feeding mixed outputs (never shipped)
flags: [stream]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 30
    suggested: [4, 200, 1]
outputs:
  # Interleaved real/integer/real, as SYNTH12 — but reached through a
  # cross-indicator call, which puts this function in the COMPOSED streaming
  # tier where SYNTH12 sits in the loop tier. The composed emitters sized their
  # `sc_` scratch and their `cur_` scalars as double for every output until this
  # fixture existed; four asserts refused the mix rather than truncate it.
  - name: outAvg
    type: real
    flags: [line]
  - name: outSide
    type: integer
    flags: [line]
  - name: outTwice
    type: real
    flags: [line]
