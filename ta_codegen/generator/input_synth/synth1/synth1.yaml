name: SYNTH1
group: Math Operators
hint: Synthetic gate function 1 - bitwise operators and truthiness (never shipped)
# `path_dependent`: `acc` is a rotate/xor hash carried across every bar of the
# main loop, so a later startIdx can never reconstruct it from the warm-up
# window. Selects TA_STABLE_SKIP for the range-stability leg (issue #127).
flags: [stream, path_dependent]
inputs:
  - name: inReal
    type: real
optional_inputs:
  - name: optInTimePeriod
    type: integer
    display_name: Time Period
    hint: Time period
    range: [2, 100000]
    default: 30
    suggested: [4, 200, 1]
outputs:
  - name: outInteger
    type: integer
    flags: [line]
