[package]
name = "ta-codegen"
version = "0.1.0"
edition = "2021"

[lib]
name = "ta_codegen_lib"
path = "src/lib.rs"

[[bin]]
name = "ta_codegen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"

# The suite renders every indicator hundreds of times: the slower build is
# repaid several times over in test CPU.
[profile.test]
opt-level = 1
