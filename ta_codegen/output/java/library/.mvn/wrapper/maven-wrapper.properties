# Which Maven builds this project -- including the release that goes to Central.
#
# `./mvnw` is not a different Maven: it downloads the official Apache distribution
# named below, then execs the real `mvn` inside it. Same binary, same plugins, same
# ~/.m2/settings.xml and ~/.m2/repository. Pinning it here is what makes "which
# Maven produced this release" answerable, instead of "whatever the OS shipped".
#
# distributionType=only-script keeps a binary out of the repo: the older wrapper
# committed a maven-wrapper.jar, this one is three text files and nothing else.
#
# 3.9.x, not 4.x: Maven 4 is still release-candidate (4.0.0-rc-6 as of 2026-08-17).
#
# distributionSha256Sum is verified before the distribution is executed. Provenance
# of this value: the zip was downloaded, its SHA-512 matched the .sha512 published
# BOTH on repo.maven.apache.org and on downloads.apache.org (two independent
# sources), and the SHA-256 below was computed from that verified file -- Central
# publishes no .sha256 for this artifact. Bumping distributionUrl means redoing
# this; a stale sum fails the build rather than silently skipping validation.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
