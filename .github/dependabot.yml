# Read from the default branch only: an edit here does nothing until it is on
# main. `target-branch` covers version updates; a security update still opens
# against main, and workflows/dependabot-prs.yml moves it to dev.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/website"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # A bump can merge with no human look, so let a bad release be caught
    # upstream first. Security updates ignore this.
    cooldown:
      default-days: 7
    # The theme pins exact versions of these. A group only batches what is
    # available that day, so check the PR against the theme's pins.
    groups:
      vuepress:
        patterns:
          - "vuepress"
          - "vuepress-theme-hope"
          - "@vuepress/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
