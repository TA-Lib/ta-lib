# TEMPORARY — delete before this branch is merged.
#
# The real nightly hardcodes `ref: dev` in every job and, being schedule-driven,
# runs the workflow FILE from the default branch. Neither can therefore exercise
# the arm64-csharp job added on this branch. This dispatch-only copy checks out
# csharp-backend instead, purely to answer the question that cannot be answered
# on an x86-64 dev box: does the .NET 10 SDK install on ubuntu-24.04-arm, and
# does the managed C# backend hold bitwise parity against the C library there?
name: tmp csharp branch check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-csharp:
    name: arm64 Linux (C# bitwise parity — managed FMA on aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout csharp-backend
        uses: actions/checkout@v6
        with:
          ref: csharp-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tooling
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake

      - name: Install Rust
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bitwise parity, C# vs the in-process C library (aarch64)
        shell: bash
        run: python3 scripts/build.py xlang-hash --language=csharp

  # The other new CI step, on x86-64: regen-check now regenerates the four
  # JSON-RPC servers, so a generator change committed without regenerating fails
  # here instead of shipping stale servers.
  regen-check:
    name: ta_codegen output up-to-date (incl. servers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout csharp-backend
        uses: actions/checkout@v6
        with:
          ref: csharp-backend

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify ta_regtest source lists (CMake vs autotools) agree
        shell: bash
        run: python3 scripts/build.py check-source-lists

      - name: Verify ta_codegen/input is formatted
        shell: bash
        run: python3 scripts/build.py format-check

      - name: Regenerate all backends and verify committed output matches
        shell: bash
        run: |
          python3 scripts/build.py generate
          (cd ta_codegen/generator && cargo run --release -- generate-bench --backend=c)
          (cd ta_codegen/generator && cargo run --release -- generate-servers)
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "::error::ta_codegen output is out of date."
            echo "$status"
            git --no-pager diff
            exit 1
          fi
          echo "ta_codegen output matches the committed source. OK."
