name: weekly maintenance

on:
  schedule:
    - cron: "0 9 * * 0" # Sundays, 09:00 UTC

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pool GC: report what would be deleted, without deleting"
        type: boolean
        default: true
      stars_dry_run:
        description: "Star figure: report whether it would be redrawn, without pushing"
        type: boolean
        default: true

# Deleting release assets and pushing to dev require write.
permissions:
  contents: write

jobs:
  # Garbage-collect the dist/ content-addressed asset pool.
  #
  # The pool (a long-lived published pre-release, tag 'ci-build-pool') accumulates
  # one asset per distinct package build. Once no live branch references a build --
  # typically after a version bump, since package.py's delete_other_versions()
  # prunes digests for older versions -- the asset is dead weight.
  #
  # This deletes ASSETS ONLY. It must never delete or recreate the pool release
  # itself: publishing a release notifies every watcher subscribed to Releases, so
  # a delete/recreate cycle would turn a one-time notification into weekly spam.
  #
  # More info: scripts/utilities/dist_pool.py
  gc:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 fetches all branches, which this needs: the live reference
      # set is the union of dist/digests/ on origin/dev AND origin/main. A shallow
      # checkout would leave one of them unreadable, and the script then aborts
      # rather than delete on partial information.
      - name: Checkout (all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # A manual dispatch defaults to --dry-run so the effect can be reviewed
      # before anything is removed. The scheduled run performs the real GC.
      - name: Collect unreferenced pool assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 scripts/dist-pool.py gc \
            --refs=origin/dev,origin/main \
            --grace-days=7 \
            ${{ inputs.dry_run && '--dry-run' || '' }}

  star-history:
    runs-on: ubuntu-latest
    if: github.repository == 'TA-Lib/ta-lib'

    steps:
      # A scheduled run checks out the default branch unless told otherwise,
      # and the figure is committed to dev.
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Redraw the star figure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 scripts/gen_star_history.py ${{ inputs.stars_dry_run && '--dry-run' || '' }}

      - name: Push the figure to dev
        shell: bash
        run: |
          FIGURE=website/src/.vuepress/public/assets/images/star-history.svg
          if [ -z "$(git status --porcelain -- "$FIGURE")" ]; then
            echo "Figure unchanged; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FIGURE"
          git commit -m "Update star history figure"
          pushed=no
          for i in $(seq 1 5); do
            if git pull --rebase origin dev && git push origin HEAD:dev; then
              pushed=yes
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          [ "$pushed" = yes ]
