# Periodic tests of the latest dev branch, for early detection of breaking
# changes.
#
# No jobs here: every job lives in nightly-jobs.yml or nightly-publish.yml. A
# scheduled run takes its DEFINITION from the default branch, so anything
# written here is as old as main; the @dev pins below are what keep the jobs and
# the tree they test on the same branch.

name: dev nightly tests

on:
  schedule:
    - cron: "0 5 * * *" # every day 5AM

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild + tests even when dist digests match"
        type: boolean
        default: false
      perf_mode:
        description: "Instruction counts, advisory. gate: warn above 10% and lower any row today beat. accept: additionally RAISE the rows named below. measure: report only, commit nothing."
        type: choice
        options: [gate, accept, measure]
        default: gate
      perf_accept:
        description: "perf_mode=accept only. Entry points to raise: SMA for every tier, SMA/batch for one, comma-separated. ALL discards what every other row accumulated, so name what you mean."
        default: ""
      perf_force_measure:
        description: "Measure even when this exact tree was already measured. Untick to exercise the skip path on demand. Ignored when perf_mode=accept."
        type: boolean
        default: true
      perf_threshold:
        description: "Fractional growth that flags one entry point (default 0.10)."
        default: "0.10"

permissions:
  contents: read

jobs:
  nightly:
    permissions:
      contents: read
    uses: TA-Lib/ta-lib/.github/workflows/nightly-jobs.yml@dev
    with:
      force_build: ${{ inputs.force_build || false }}
      perf_mode: ${{ inputs.perf_mode }}
      perf_accept: ${{ inputs.perf_accept }}
      perf_force_measure: ${{ inputs.perf_force_measure || false }}
      perf_threshold: ${{ inputs.perf_threshold }}

  # The run's only writer. !cancelled(): a red job in `nightly` must not by
  # itself skip this one.
  publish:
    needs: nightly
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: TA-Lib/ta-lib/.github/workflows/nightly-publish.yml@dev
    with:
      dist_linux: ${{ needs.nightly.outputs.dist_linux }}
      dist_windows: ${{ needs.nightly.outputs.dist_windows }}
      icount: ${{ needs.nightly.outputs.icount }}
