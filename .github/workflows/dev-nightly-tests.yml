# Periodic tests of the latest dev branch, for early detection of breaking
# changes.
#
# Cron only: every job lives in nightly-jobs.yml. A scheduled run takes its
# DEFINITION from the default branch, so anything written here is as old as
# main; the @dev pin below is what keeps the jobs and the tree they test on the
# same branch.
#
# The force_build and perf knobs live on nightly-jobs.yml itself. Reach them
# with `gh workflow run nightly-jobs.yml --ref dev -f force_build=true`.

name: dev nightly tests

on:
  schedule:
    - cron: "0 5 * * *" # every day 5AM

  workflow_dispatch:

jobs:
  nightly:
    # A ceiling, not a grant: `test` and `icount` commit back to dev and inherit
    # it, every other job asks for contents: read itself.
    permissions:
      contents: write
    uses: TA-Lib/ta-lib/.github/workflows/nightly-jobs.yml@dev
