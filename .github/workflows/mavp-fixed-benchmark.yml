name: MAVP fixed-period verification
on:
  push:
    branches: [codex/mavp-fixed-period]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          repository: TA-Lib/ta-lib
          ref: 4334163d3a1f5019aa9051342316b936a4dfb994
          path: baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - name: Verify regeneration, Rust contracts and C regression
        working-directory: candidate
        run: |
          python scripts/quiet.py noisy mavp-ci --defer=60 -- python scripts/build.py regen-check
          python scripts/quiet.py noisy mavp-ci --defer=60 -- cargo test --locked -p ta-lib --manifest-path ta_codegen/output/rust/Cargo.toml
          python scripts/quiet.py noisy mavp-ci --defer=60 -- cargo clippy --locked -p ta-lib --all-targets --manifest-path ta_codegen/output/rust/Cargo.toml -- -D warnings
          python scripts/quiet.py noisy mavp-ci --defer=60 -- python scripts/build.py ta_regtest
          bin/ta_regtest
      - name: Build both release libraries and identical thin-LTO harness
        working-directory: candidate
        run: |
          python scripts/quiet.py noisy mavp-ci --defer=60 -- python scripts/bench_mavp_fixed.py \
            --baseline ../baseline-bench --baseline-source ../baseline \
            --candidate ../candidate-bench --candidate-source . --output ../mavp-results --build-only
          lscpu > ../mavp-results/lscpu.txt
          cat /proc/meminfo > ../mavp-results/meminfo.txt
      - name: Compare full captures then alternate twelve fresh-process pairs
        working-directory: candidate
        run: |
          python scripts/quiet.py measure mavp-ci 300 --queue=300 -- python scripts/bench_mavp_fixed.py \
            --baseline ../baseline-bench --baseline-source ../baseline \
            --candidate ../candidate-bench --candidate-source . --output ../mavp-results --pairs 12 --repeats 31
          cat ../mavp-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mavp-fixed-period-evidence
          path: |
            mavp-results/*.json
            mavp-results/*.jsonl
            mavp-results/*.md
            mavp-results/*.log
            mavp-results/*.txt
            mavp-results/*.gz
            baseline-bench
            candidate-bench
