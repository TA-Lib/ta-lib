# Periodic tests of the latest main branch: the same jobs dev runs, pinned at
# THIS branch, so main is tested by main's definition against main's tree.
#
# Cron only: every job lives in nightly-jobs.yml.

name: main nightly tests

on:
  schedule:
    - cron: "0 7 * * *" # every day 7AM

  workflow_dispatch:

jobs:
  nightly:
    # Read-only is structural here rather than a promise the jobs keep:
    # nightly-jobs.yml's write steps cannot be granted what this caller never
    # had, and a job that asked for write would fail validation before the run
    # starts.
    permissions:
      contents: read
    uses: TA-Lib/ta-lib/.github/workflows/nightly-jobs.yml@main
