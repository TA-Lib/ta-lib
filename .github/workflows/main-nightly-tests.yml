# Periodic tests of latest main branch
#

name: main nightly tests

# Controls when the workflow will run
on:
  schedule:
    - cron: "0 7 * * *" # every day 7AM

  workflow_dispatch:

# Read-only: this workflow never pushes, releases, or comments.
permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          pip install PyGithub

      - name: Prepare shell envs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "PYTHON=python3" >> $GITHUB_ENV

      # Restore the packages referenced by dist/digests/ BEFORE package.py runs.
      # This is what lets main REUSE the artifact dev built and tested rather than
      # rebuilding it: is_build_skipping_allowed() hashes the local file, so with no
      # file the skip is denied and a manual dispatch (how a release is cut --
      # README-DEVS.md step 6) would silently rebuild instead of reusing.
      #
      # Reading the pool needs no more than the contents:read this workflow already
      # has: the pool is a PUBLISHED pre-release, so it is listable with a read token
      # and its assets download anonymously. A draft pool would have required
      # contents:write here, costing this workflow its read-only posture.
      - name: Fetch dist packages from the asset pool (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: $PYTHON $GITHUB_WORKSPACE/scripts/dist-pool.py pull --allow-missing

      - name: Install dist build tooling (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          # One install per line, matching the grouping this job has always
          # used; merging them breaks gcc-13-*-linux-gnu resolution.
          packages: |
            automake libtool autogen
            openjdk-21-jdk
            gcc-multilib
            gcc-i686-linux-gnu
            gcc-aarch64-linux-gnu

      - name: Build dist assets (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          $PYTHON $GITHUB_WORKSPACE/scripts/package.py
          $PYTHON $GITHUB_WORKSPACE/scripts/test-dist.py

      - name: Prepare shell envs (Windows x64)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          :: call "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe > msbuild_path.txt
          :: set /p MSBUILD_PATH=<msbuild_path.txt
          :: set VCVARSALL=%MSBUILD_PATH%\..\..\..\..\VC\Auxiliary\Build\vcvarsall.bat
          :: echo VCVARSALL=%VCVARSALL% >> %GITHUB_ENV%
          echo PYTHON=python >> %GITHUB_ENV%

      # NOTE: one command per step (or && chains). A multi-line `shell: cmd`
      # script propagates only the LAST command's exit code, masking every
      # failure before it. WiX is version-pinned for determinism; v7
      # requires the OSMF EULA acceptance step below.
      - name: Install WiX (Windows x64)
        if: runner.os == 'Windows'
        shell: cmd
        run: dotnet tool install --global wix --version 7.0.0 && echo %USERPROFILE%\.dotnet\tools>>%GITHUB_PATH%

      # TA-Lib generates no revenue, so the Open Source Maintenance Fee does
      # not apply (the OSMF exempts organizations under USD 10k/year), but
      # WiX v7 still requires explicit EULA acceptance (WIX7015 otherwise).
      # Accepted per project-maintainer decision, 2026-07-03.
      - name: Accept WiX OSMF EULA (Windows x64)
        if: runner.os == 'Windows'
        shell: cmd
        run: wix eula accept wix7

      - name: Add WiX UI extension (Windows x64)
        if: runner.os == 'Windows'
        shell: cmd
        run: wix extension add --global WixToolset.UI.wixext/7.0.0 && wix extension list --global

      # See the Linux fetch step above for why this must precede package.py.
      - name: Fetch dist packages from the asset pool (Windows x64)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: '%PYTHON% %GITHUB_WORKSPACE%\scripts\dist-pool.py pull --allow-missing'

      - name: Build dist assets (Windows x64)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: '%PYTHON% %GITHUB_WORKSPACE%\scripts\package.py'

      - name: Test dist assets (Windows x64)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: '%PYTHON% %GITHUB_WORKSPACE%\scripts\test-dist.py'

      - name: Verify dist assets are up-to-date
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Still meaningful with the packages gitignored: dist/digests/ remains
          # TRACKED, and package.py rewrites a digest whenever the rebuilt package
          # differs materially from the recorded one. So a real divergence between
          # main's sources and main's committed digests still shows up here.
          dist_changes=$(git status --porcelain dist/)
          ta_common_changes=$(git status --porcelain include/ta_common.h)
          if [ -n "$dist_changes" ] || [ -n "$ta_common_changes" ]; then
            echo "Error: Unexpected changes in dist/ assets."
            echo "The dev-nigthly-tests.yml should have updated these assets."
            exit 1
          fi

      # The check above proves main's digests match main's sources. This proves the
      # packages those digests NAME are actually retrievable -- the half that stopped
      # being self-evident once the binaries left git. Strict (no --allow-missing):
      # on main, a digest pointing at content the pool cannot produce means the next
      # release would have nothing to attach, and that must be loud.
      - name: Verify every referenced package exists in the asset pool
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: $PYTHON $GITHUB_WORKSPACE/scripts/dist-pool.py verify

      # Soft check only: the website (website/src/install/c/README.md) is expected to lag briefly
      # after a release until dev-nightly syncs it and it merges to main. Surface
      # a warning if it is behind, but never fail -- keep the main badge green.
      - name: Warn if website is out of date (soft)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          $PYTHON $GITHUB_WORKSPACE/scripts/sync-website.py --check --warn-only

  # Release gate: prove the library is still bit-identical to v0.6.4 at
  # period>=2. C-only, gated on 'test'. fetch-depth: 0 for the v0.6.4 tag.
  # See src/tools/ta_regtest/CLAUDE.md.
  fuzz-vs-064:
    name: Bit-exact fuzz vs released v0.6.4
    needs: test
    # Run after 'test' but don't let an unrelated failure (e.g. the Windows leg)
    # silently skip this release gate — it has its own checkout+build.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # ta_064_serve builds from the released v0.6.4 tag

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fuzz current library vs frozen v0.6.4
        shell: bash
        run: python3 scripts/build.py fuzz-064

  # Cross-language BITWISE parity gate (issue #113): the generated language
  # servers must be BIT-IDENTICAL to the shipped in-process C library (no
  # tolerance). Rust crosses the JSON boundary with a seed; Java and C# with
  # lossless hex inputs (#114). Java AND C# relax their transcendental-using
  # calls to a 1e-9 tolerance (fdlibm != the C libm; .NET does not guarantee
  # Math.* reaches the platform libm). Everything else stays bitwise.
  # cmake+gcc+cargo are preinstalled on ubuntu-latest; the Java server needs the
  # JDK and the managed C# server needs the .NET SDK (both set up below).
  xlang-hash:
    name: Bitwise parity (C vs Rust + Java + C#, seed/hex+hash)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install JDK
        uses: ./.github/actions/apt-install
        with:
          packages: openjdk-21-jdk

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Bitwise-diff each language server vs the in-process C library
        shell: bash
        run: python3 scripts/build.py xlang-hash

  # Rust on the release branch (#179 E5): dev-nightly's `clippy` job with
  # `ref: main`, plus rust_package_check.py because main is the branch a .crate
  # publishes from and nothing here ever compiled the crate. Content merged from
  # dev has already been through dev-nightly; what this covers is the commits
  # only main sees -- the dist bot's, hotfixes, and the release cut itself.
  # Not gated on 'test': no C build is needed, so a dist-pool failure must not
  # skip the release branch's only Rust coverage. MSRV stays dev-only.
  rust:
    name: Rust clippy + docs + tests (release branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Ensure clippy component
        shell: bash
        run: rustup component add clippy

      - name: Clippy the generator tool
        shell: bash
        run: cargo clippy --all-targets --manifest-path ta_codegen/generator/Cargo.toml -- -D warnings

      - name: Clippy the generated crate
        shell: bash
        run: cargo clippy --all-targets --manifest-path ta_codegen/output/rust/Cargo.toml -- -D warnings

      - name: Rustdoc the generated crate
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p ta-lib --manifest-path ta_codegen/output/rust/Cargo.toml

      - name: Test the generator tool
        shell: bash
        run: cargo test --no-fail-fast --manifest-path ta_codegen/generator/Cargo.toml

      - name: Run the generated crate's doctests
        shell: bash
        run: cargo test --doc -p ta-lib --manifest-path ta_codegen/output/rust/Cargo.toml

      - name: Run the generated crate's unit and integration tests
        shell: bash
        run: cargo test --tests -p ta-lib --manifest-path ta_codegen/output/rust/Cargo.toml

      - name: Package the publishable crates and check what ships
        shell: bash
        run: python3 scripts/rust_package_check.py

  # regen-check on the release branch (#179 E5): the same command the PR gate and
  # dev-nightly run, here for the commits only main sees (the dist bot's, which
  # rewrite a tracked header, and hotfixes). Not gated on 'test' -- it regenerates
  # source and needs nothing the C build produces.
  regen-check:
    name: ta_codegen output up-to-date (release branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Regenerate all backends and verify committed output matches
        shell: bash
        run: |
          if ! python3 scripts/build.py regen-check; then
            echo "::error::ta_codegen output on main is out of date. Run 'scripts/build.py generate' and commit the result — see the log above for which files drifted."
            exit 1
          fi

      - name: Candle trailing-total wiring (read AND write side)
        shell: bash
        run: |
          if ! python3 scripts/build.py check-candle-windows; then
            echo "::error::A candlestick's trailing total is wired to the wrong bar — see the log above."
            exit 1
          fi
