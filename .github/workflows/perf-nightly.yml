# Instruction-count regression detection for every C entry point (issue #412).
#
# Separate from dev-nightly-tests.yml, and deliberately NOT on push or
# pull_request. The committed baseline is a single-writer file: concurrent runs
# would race to push it, which is why even the daily trigger is serialised by
# the concurrency group below.
#
# Wall clock is not measurable here. Every runner is a shared vCPU; the existing
# tools already concede it (`ta_bench_direct --max-spread=25 --no-signal=1.20`,
# `ta_bench_stream --min-ratio=0.35`), so a 10% time threshold would be alarm
# noise, not a gate. Counting retired instructions under callgrind instead makes
# the measurement exact: byte-identical across runs on a loaded box. That is what
# lets a 10% threshold mean something.
#
# What it does NOT see: out-of-order execution, port pressure, dependency-chain
# latency. Valgrind also over-charges branchy code, so a branchless rewrite can
# read here as a regression. The counts catch the algorithmic class (a lost fast
# path, an extra pass over the window, an un-inlined call), and nothing from this
# job ever becomes a quoted performance figure. The devbox stays the oracle for
# that.

name: perf nightly

on:
  schedule:
    # Clear of both other nightlies (dev 5AM, which can run 90 minutes, and
    # main 7AM): all three push to a branch, and this one commits to dev.
    - cron: "0 8 * * *" # every day 8AM

  workflow_dispatch:
    inputs:
      mode:
        description: "gate: fail above the threshold, and on a pass lower any row today beat. accept: additionally RAISE the rows named below, and only those. measure: report only, commit nothing."
        type: choice
        options: [gate, accept, measure]
        default: gate
      accept:
        description: "mode=accept only. Entry points to raise to today's count: SMA for every tier, SMA/batch for one, comma-separated. ALL re-baselines the corpus and discards what every other row accumulated, so name what you mean."
        default: ""
      threshold:
        description: "Fractional growth that fails one entry point"
        default: "0.10"

permissions:
  contents: read

# The baseline is one committed file with one writer. Overlapping runs would
# race to push it; queueing costs nothing on a daily job.
concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  icount:
    name: Instruction counts (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MODE: ${{ inputs.mode || 'gate' }}
      THRESHOLD: ${{ inputs.threshold || '0.10' }}
      ACCEPT: ${{ inputs.accept || '' }}

    steps:
      - name: Checkout dev Branch
        uses: actions/checkout@v6
        with:
          ref: dev

      # An instruction count can only move if the library, the headers, the
      # CMake build or the generated bench moved, so a day of docs-only commits
      # should not spend a runner. The fingerprint is git's own tree hashes, so
      # it needs no state in the repo and costs no commit to maintain, and the
      # cache key IS the fingerprint: a hit means this exact tree was already
      # measured. Anything unexpected (no fingerprint, cache miss, cache
      # evicted) falls through to measuring, so the failure mode is a wasted
      # run and never a silent skip.
      #
      # Scheduled runs only. A human who dispatched this asked for a
      # measurement and gets one.
      - name: Fingerprint the sources a count can depend on
        id: fp
        run: |
          set -o pipefail
          if ! fp=$(git rev-parse HEAD:src HEAD:include HEAD:CMakeLists.txt \
                                  HEAD:ta_codegen/output/c | tr '\n' '-'); then
            echo "could not fingerprint the tree; measuring."
            fp="unfingerprinted-$GITHUB_RUN_ID"
          fi
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/perf"
          echo "$fp" > "$RUNNER_TEMP/perf/fingerprint"

      - name: Has this exact tree already been measured?
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/perf
          key: perf-icount-fp-${{ steps.fp.outputs.fp }}
          lookup-only: true

      - name: Decide whether to measure
        id: decide
        env:
          SEEN: ${{ steps.seen.outputs.cache-hit }}
        run: |
          if [ "$SEEN" = "true" ]; then
            echo "measure=false" >> "$GITHUB_OUTPUT"
            msg="Skipped: nothing that can move an instruction count changed since the last measured run."
            echo "$msg"
            echo "## Instruction-count suite" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python
        if: steps.decide.outputs.measure == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Supplies both the tool and <valgrind/callgrind.h>. The header is needed
      # at COMPILE time, so this has to precede the build step, not the run.
      - name: Install valgrind
        if: steps.decide.outputs.measure == 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: |
            valgrind

      - name: Build ta_bench_icount
        if: steps.decide.outputs.measure == 'true'
        run: python3 scripts/build.py ta_bench_icount

      - name: Measure and compare
        if: steps.decide.outputs.measure == 'true'
        run: |
          case "$MODE" in
            gate)    flags="--update-baseline" ;;
            accept)
              # No silent wholesale re-baseline: accepting a regression has to
              # name the rows it is accepting.
              if [ -z "$ACCEPT" ]; then
                echo "mode=accept needs the 'accept' input (e.g. SMA, or SMA/batch)."
                exit 2
              fi
              flags="--accept=$ACCEPT" ;;
            measure) flags=""                  ;;
            *) echo "unknown mode '$MODE'"; exit 2 ;;
          esac
          python3 scripts/bench_icount.py --no-build --threshold="$THRESHOLD" $flags

      # Reached only when the step above exited 0, and in `gate` mode
      # bench_icount.py only ever LOWERS a row. A regression cannot be absorbed
      # here one green night at a time; raising a row needs mode=accept naming
      # that row, which is a person deciding to.
      - name: Commit the lowered baseline
        if: success() && env.MODE != 'measure' && steps.decide.outputs.measure == 'true'
        run: |
          changes=$(git status --porcelain .github/perf/)
          if [ -z "$changes" ]; then
            echo "Baseline unchanged."
            exit 0
          fi
          echo "$changes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/perf/
          git commit -m "perf: lower the instruction-count baseline"
          # dev moves under a run that takes minutes: dev-nightly commits dist/
          # and include/ta_common.h on its own schedule. Disjoint paths, so the
          # rebase never has to resolve anything.
          #
          # NO --strategy-option=ours, unlike the dist commit in
          # dev-nightly-tests.yml. During a rebase "ours" is the UPSTREAM side,
          # so a conflict here would silently discard the baseline this run just
          # measured. Nothing else writes .github/perf/, so a conflict means an
          # assumption broke and the run should say so rather than drop it.
          for i in {1..5}; do
            git pull --rebase origin dev && git push origin dev && break || sleep 10
          done

      # Only after a measurement that got that far, so a skipped run does not
      # record that this tree was measured when it was not.
      - name: Remember this tree as measured
        if: steps.decide.outputs.measure == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/perf
          key: perf-icount-fp-${{ steps.fp.outputs.fp }}

      - name: Upload the raw callgrind output
        if: steps.decide.outputs.measure == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: callgrind-icount
          path: temp/callgrind.icount.out
          if-no-files-found: warn
          retention-days: 14
