# ta-lib.org deployment — VuePress (vuepress-theme-hope) build → gh-pages.
#
# Mirrors the proven sui-cookbook / suibase VuePress deploy: pinned pnpm
# (an explicit version avoids pnpm/action-setup's self-update crash that hit
# "latest"), frozen-lockfile install, build, then JamesIves gh-pages deploy.
name: Website

on:
  push:
    branches: [main]
    # Only redeploy when the site actually changes. The generated function
    # pages live under website/src/functions/, so they are covered too.
    # `workflow_dispatch` still forces a manual deploy regardless.
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    permissions:
      contents: write # pushes the built site to gh-pages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required: `plugins.git: false` only hides the
          # contributors/last-updated UI — data.git.updatedTime is still
          # populated, and the sitemap/seo plugins derive every page's
          # lastmod, og:updated_time and JSON-LD dateModified from it. In a
          # shallow clone `git log -1 -- <file>` yields the tip commit for
          # every file, stamping all pages with the same deploy-time date.
          fetch-depth: 0
          filter: blob:none

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.2.2"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          pnpm run docs:build
          > src/.vuepress/dist/.nojekyll
        working-directory: website

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: website/src/.vuepress/dist
