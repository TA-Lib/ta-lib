name: apt-install
description: >-
  Install Debian packages on a hosted runner, hardened against the ways apt
  stalls there. Every nightly job that needs a toolchain goes through this, so
  the hardening lives in one place instead of being re-typed per job.

inputs:
  packages:
    description: >-
      Packages to install, ONE apt-get install PER LINE (whitespace-separated
      within a line). The split is deliberate, not cosmetic: resolving several
      toolchain metapackages in a single call asks apt for one consistent set
      across all of them, which fails where sequential calls succeed --
      installing gcc-multilib, gcc-i686-linux-gnu and gcc-aarch64-linux-gnu
      together reports gcc-13-*-linux-gnu as "not installable". Keep a caller's
      grouping unless you have re-tested it.
    required: true
  cache:
    description: >-
      'false' in a job that holds a write token: restoring a cache unpacks
      whatever any job of a main-ref run saved under the key, anywhere the
      runner user can write, so it would hand that token to third-party code
      running in a read-only job.
    default: 'true'

runs:
  using: composite
  steps:
    # The .debs come from the Actions cache once a run has fetched them, so a
    # mirror trickling at tens of kB/s (no apt retry or timeout gets through
    # that) cannot time a job out. A new image restores the previous image's
    # set and fetches only the versions that changed.
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        sum=$(printf '%s' "$PACKAGES" | sha256sum | cut -c1-16)
        echo "prefix=apt-debs-${ImageOS:-unknown}-${RUNNER_ARCH}-$sum-" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "APT_ARCHIVES=$RUNNER_TEMP/apt-archives" >> "$GITHUB_ENV"

    - id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.image }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.image }}-
          ${{ steps.key.outputs.prefix }}

    - id: install
      shell: bash
      env:
        IMAGE_PREFIX: ${{ steps.key.outputs.prefix }}${{ steps.key.outputs.image }}
        # No tty on a runner: a package that prompts would block until the job
        # timeout rather than fail.
        DEBIAN_FRONTEND: noninteractive
        # Via env, not ${{ }} inside run: keeps the package list out of the
        # script text that the shell parses.
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail

        # The image's own unattended-upgrades run holds /var/lib/dpkg/lock-frontend
        # for the first minutes after boot. Stopping the timers is best-effort --
        # DPkg::Lock::Timeout below is what actually bounds the wait.
        sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
        sudo systemctl stop unattended-upgrades.service 2>/dev/null || true

        # apt-get, not apt: apt has no stable CLI for scripts and says so on stderr.
        # Acquire::Retries    - a stalled Azure mirror retries instead of hanging.
        # DPkg::Lock::Timeout - wait for a held lock, then FAIL; the default is to
        #                       wait forever, which is how a 12-minute job becomes
        #                       a 6-hour one.
        APT_OPTS=(-o Acquire::Retries=3 -o DPkg::Lock::Timeout=600)
        rm -rf "$APT_ARCHIVES/partial"
        mkdir -p "$APT_ARCHIVES/partial"

        sudo apt-get update "${APT_OPTS[@]}"

        # apt takes a .deb already in the archive dir on its size alone, so a
        # restored one is trusted only if its SHA256 is the signed index's.
        verified() {
          local pkg arch ver sum
          [ -f "$1" ] && [ ! -L "$1" ] || return 1
          pkg=$(dpkg-deb -f "$1" Package) && arch=$(dpkg-deb -f "$1" Architecture) \
            && ver=$(dpkg-deb -f "$1" Version) && sum=$(sha256sum "$1" | cut -d' ' -f1) || return 1
          apt-cache show "$pkg:$arch=$ver" 2>/dev/null | grep -x "SHA256: $sum" >/dev/null \
            || apt-cache show "$pkg=$ver" 2>/dev/null | grep -x "SHA256: $sum" >/dev/null
        }
        shopt -s nullglob
        for deb in "$APT_ARCHIVES"/*.deb; do
          verified "$deb" || { echo "Dropping unverified $(basename "$deb")"; rm -rf "$deb"; }
        done

        # One call per line -- see the `packages` input docs for why these are
        # not merged. No --no-install-recommends either: the toolchain
        # metapackages here were only ever tested with recommends on.
        while IFS= read -r group; do
          [ -n "${group//[[:space:]]/}" ] || continue
          # Unquoted on purpose: a line is a list of packages to word-split.
          # shellcheck disable=SC2086
          sudo apt-get install -y "${APT_OPTS[@]}" \
            -o Dir::Cache::Archives="$APT_ARCHIVES/" \
            -o APT::Keep-Downloaded-Packages=true $group
        done <<< "$PACKAGES"

        # Keep only the versions now installed, so the cache does not grow
        # with every package update.
        sudo rm -rf "$APT_ARCHIVES/partial" "$APT_ARCHIVES/lock"
        sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"
        for deb in "$APT_ARCHIVES"/*.deb; do
          pkg=$(dpkg-deb -f "$deb" Package)
          ver=$(dpkg-deb -f "$deb" Version)
          arch=$(dpkg-deb -f "$deb" Architecture)
          have=$(dpkg-query -W -f='${Version}' "$pkg:$arch" 2>/dev/null \
                 || dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)
          [ "$have" = "$ver" ] || rm -f "$deb"
        done
        echo "$(ls "$APT_ARCHIVES" | wc -l) .deb(s) kept for the cache."
        # Named by content, so a mirror update during one image is saved too.
        echo "key=$IMAGE_PREFIX-$(ls "$APT_ARCHIVES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - if: inputs.cache == 'true' && steps.install.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.install.outputs.key }}
